# SRS Configuration — RTMP + HTTP-FLV + WebRTC (WHEP)
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled     on;
    listen      8080;
    dir         ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

rtc_server {
    enabled         on;
    listen          8000;
    # CANDIDATE is the LAN IP of this machine passed via env at container start
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    # ---------------------------------------------
    # ULTRA-LOW LATENCY CONFIGURATION
    # ---------------------------------------------
    tcp_nodelay     on;
    min_latency     on;

    play {
        gop_cache       off;  # Do not cache GOP, sends frames instantly
        queue_length    10;   # Minimal queue length
        mw_latency      100;  # Minimized Merged-Write latency
    }

    publish {
        mr off;               # Disable Merged-Read for publishing
    }

    # Receive RTMP from FFmpeg and distribute it
    rtc {
        enabled         on;
        rtmp_to_rtc     on;   # Convert incoming RTMP to WebRTC (WHEP playback)
        rtc_to_rtmp     off;
    }

    # HTTP-FLV remains available as a fallback
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
