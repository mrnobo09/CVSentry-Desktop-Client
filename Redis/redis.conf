# =============================================================================
# CVSentry Redis Configuration
# =============================================================================

# Bind to all interfaces so Docker networking works
bind 0.0.0.0

# Port
port 6379

# Disable the default no-auth access (requirepass is replaced by ACL)
# We use ACL-based authentication via users.acl
aclfile /usr/local/etc/redis/users.acl

# Disable the default user completely (security best practice)
# The 'default' user is disabled inside users.acl

# Persistence — append-only file for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB snapshot (fallback persistence)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Disable dangerous commands for non-admin users (handled via ACL)
# rename-command FLUSHALL ""
# rename-command CONFIG   ""
